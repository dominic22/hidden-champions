          - type: entities
            entities:
              - entity: climate.buro_eg
                name: Regler (Stufe / Modus / Feuchte)
              - entity: sensor.buro_eg_luftqualitat
                name: Luftqualität
              - entity: sensor.buro_eg_filter_status
                name: Filter
              - entity: binary_sensor.buro_eg_luftfeuchte_alarm
